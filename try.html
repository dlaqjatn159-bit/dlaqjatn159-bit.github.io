  hexLab(h) {

    return '#' + r.map((c) => { c = Math.max(0, Math.min(1, c)); c = c > 0.0031308 ? 1.055 * Math.pow(c, 1 / 2.4) - 0.055 : 12.92 * c; return ('0' + Math.round(c * 255).toString(16)).slice(-2); }).join('').toUpperCase();

    return best;

  // 글 복사 (카톡 상담, 11-13): 인스타·네이버 앱 안 브라우저에서 막히면 false — 안내 화면이 '길게 눌러 복사'로 바뀜

      document.body.removeChild(ta);
    } catch (e) {}

      })[wish.id] : wish.line,
      line2: care.line,
      msg,
      smsHref: 'sms:01075231952' + (ios ? '&' : '?') + 'body=' + encodeURIComponent(msg),
      phone,
      kakaoStyle: phone ? 'border: 1px solid var(--rd-site-color-line-strong); background: none; color: var(--rd-site-color-text);' : 'border: none; background: var(--rd-site-color-button); color: var(--rd-site-color-button-text);',
      guide: !!s.guide,
      guideTitle: copied ? '신청 글을 복사해 두었습니다' : '아래 글을 길게 눌러 복사해 주세요',
      guideLine: touch ? '카톡 창의 글 쓰는 칸을 꾹 눌러 붙여 넣어 주세요.' : '카톡 창의 글 쓰는 칸에 Ctrl+V(맥은 ⌘+V)로 붙여 넣어 주세요.',
      kakao: () => { const ok = this.copyText(msg); this.setState({ guide: true, copied: ok }); },
      openKakao: () => { if (this.copyText(msg)) this.setState({ copied: true }); },
      closeGuide: () => this.setState({ guide: false }),
      // 홈에서 들어왔으면 뒤로 가기로 — 보던 자리로 돌아감 (1107)
      goHome: (ev) => {
        try {
          const r = document.referrer ? new URL(document.referrer) : null;
          if (r && r.origin === location.origin && /\/(index\.html)?$/.test(r.pathname) && history.length > 1) { if (ev) ev.preventDefault(); history.back(); }
        } catch (e) {}
      },
      restart: () => { (this.timers || []).forEach(clearTimeout); try { if (location.search) history.replaceState(null, '', location.pathname); } catch (e) {} this.setState({ step: 0, guide: false, seek: null, dir: null, view: false }); },
      // 머리줄 (11-13): 첫 질문·결과 = 다른 쪽과 같은 머리, 그 사이 = 이전 질문 + 로고
      topNav: step === 0 || step === 4 || !!s.view,
      midQ: (step > 0 && step < 4) || (step === 5 && !s.view),
      back: () => { (this.timers || []).forEach(clearTimeout); if (step === 5) { set({ step: 4, guide: false }); return; } set({ step: Math.max(0, step - 1), guide: false, seek: null, dir: null }); }
    };
  }
