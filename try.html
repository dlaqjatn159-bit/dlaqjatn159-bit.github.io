<script>
class Component extends DCLogic {
  // 내 공간으로 해 보기 (8단계): 공간 → 마음 쓰이는 것 → 벽·바닥·가구 색 → 바람 → 조각보와 방향
  //  맞추는 기준은 보이지 않게, 고른 색에 따라 창가 칸이 달라지는 것만 보여 줌
  hexLab(h) {
    const v = [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255).map((c) => c > 0.04045 ? Math.pow((c + 0.055) / 1.055, 2.4) : c / 12.92);
    const x = (v[0] * 0.4124 + v[1] * 0.3576 + v[2] * 0.1805) / 0.95047, y = v[0] * 0.2126 + v[1] * 0.7152 + v[2] * 0.0722, z = (v[0] * 0.0193 + v[1] * 0.1192 + v[2] * 0.9505) / 1.08883;
    const f = (t) => t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
    return [116 * f(y) - 16, 500 * (f(x) - f(y)), 200 * (f(y) - f(z))];
  }
  labHex(L, a, b) {
    const fy = (L + 16) / 116, fx = fy + a / 500, fz = fy - b / 200;
    const g = (t) => t * t * t > 0.008856 ? t * t * t : (t - 16 / 116) / 7.787;
    const X = 0.95047 * g(fx), Y = g(fy), Z = 1.08883 * g(fz);
    const r = [3.2406 * X - 1.5372 * Y - 0.4986 * Z, -0.9689 * X + 1.8758 * Y + 0.0415 * Z, 0.0557 * X - 0.204 * Y + 1.057 * Z];
    return '#' + r.map((c) => { c = Math.max(0, Math.min(1, c)); c = c > 0.0031308 ? 1.055 * Math.pow(c, 1 / 2.4) - 0.055 : 12.92 * c; return ('0' + Math.round(c * 255).toString(16)).slice(-2); }).join('').toUpperCase();
  }
  dE(p, q) { return Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]); }
  // 창가 칸 색 (안쪽 계산 — 화면에는 결과만)
  drapeLab(wish, W, F, U) {
    if (wish === 'wide') return [W[0] - 4, W[1] * 0.8, W[2] * 0.8 + 1];
    if (wish === 'soft') return [W[0] - 10, (W[1] + F[1]) * 0.3 + 0.5, Math.max(W[2], 5) + 3];
    if (wish === 'calm') return [W[0] - 21, W[1] * 0.3, W[2] * 0.3 - 1];
    const cands = [[30, 26, 9], [46, -4, -15], [47, -6, 17], [36, 1, -2]];
    let best = cands[0], score = -1;
    cands.forEach((c) => { const s = Math.min(this.dE(c, W), this.dE(c, F), this.dE(c, U)); if (s > score) { score = s; best = c; } });
    return best;
  }
  componentWillUnmount() { (this.timers || []).forEach(clearTimeout); }
  seek() {
    (this.timers || []).forEach(clearTimeout);
    let reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    if (reduce) { this.setState({ seek: 5 }); return; }
    this.timers = [0, 1, 2, 3, 4, 5].map((k) => setTimeout(() => this.setState({ seek: k }), 260 + k * 190));
  }
  renderVals() {
    const hf = this.props.hf ?? '고딕';
    const s = this.state || {};
    const step = s.step || 0;
    const set = (patch) => this.setState(Object.assign({}, s, patch));
    const PAPER = '#EDE9E2';
    const walls = [['웜 화이트', '#F4EFE6'], ['퓨어 화이트', '#F5F6F7'], ['크림 베이지', '#ECE2D0'], ['그레이지', '#E1DCD3'], ['스톤 그레이', '#CFCDC8'], ['세이지', '#DBE0D7']];
    const floors = [['화이트 오크', '#D8C8AE'], ['내추럴 오크', '#C4A47C'], ['월넛', '#7A5A42'], ['진한 마루', '#5E4636'], ['회색 타일', '#CFCBC4'], ['흰 타일', '#ECEAE5']];
    const furns = [['흰색', '#EEEBE6'], ['밝은 원목', '#CDB08A'], ['짙은 원목', '#6E5140'], ['회색 패브릭', '#A9A6A0'], ['검정', '#3B3836']];
    const spaces = ['거실', '침실', '아이 방', '작업실 · 가게'];
    const cares = [
      { label: '한낮 햇빛이 강해요', line: '한낮 햇빛은 속지가 비치는 정도로 덜어 냅니다.' },
      { label: '바깥 시선이 신경 쓰여요', line: '밖에서 보이는 정도는 속지가 비치는 정도로 정합니다.' },
      { label: '아침 빛에 잠이 깨요', line: '아침 빛까지 막으려면 겉지는 암막으로 갑니다.' },
      { label: '채광은 살리고 싶어요', line: '빛은 살리고 눈부심만 덜어 내는 속지를 고릅니다.' }
    ];
    const wishes = [
      { id: 'wide', label: '넓어 보였으면 해요', line: '벽 색에 커튼을 녹여, 창가가 벽처럼 이어지게 합니다.' },
      { id: 'soft', label: '포근했으면 해요', line: '벽보다 조금 짙고 따뜻한 색을 고르고, 결은 보송한 쪽으로 봅니다.' },
      { id: 'point', label: '포인트가 있었으면 해요', line: '벽·바닥과 다른 색으로, 눈이 먼저 창가로 가게 합니다.' },
      { id: 'calm', label: '차분했으면 해요', line: '벽보다 한 톤 낮은 색으로 창가를 가라앉힙니다.' }
    ];
    // 0 공간 · 1 마음 쓰이는 것 · 2 색 · 3 바람 · 4 결과
    const qs = { 0: { title: '어느 공간의 창인가요?', list: spaces.map((x) => ({ label: x })), key: 'space' }, 1: { title: '창가에서 가장\n마음 쓰이는 것은요?', list: cares, key: 'care' }, 3: { title: '어떤 느낌을\n바라세요?', list: wishes, key: 'wish' } };
    const asking = step === 0 || step === 1 || step === 3;
    const qd = qs[asking ? step : 0];
    const q = {
      title: qd.title,
      anim: step % 2 ? 'rq-b' : 'rq-a',
      options: qd.list.map((o, i) => ({
        label: o.label,
        pick: () => {
          const p = { step: step + 1 }; p[qd.key] = i;
          if (step === 3) { p.seek = -1; set(p); this.seek(); } else set(p);
        }
      }))
    };
    const rowDef = [['벽', walls, 'wall'], ['바닥', floors, 'floor'], ['가구', furns, 'furn']];
    const rows = rowDef.map(([label, list, key]) => ({
      label,
      pickedName: s[key] != null ? ' · ' + list[s[key]][0] : '',
      opts: list.map(([name, hex], i) => ({
        name, hex,
        on: s[key] === i ? 'true' : 'false',
        dot: s[key] === i ? '#8A4A22' : 'transparent',
        pick: () => { const p = {}; p[key] = i; set(p); }
      }))
    }));
    const ready = s.wall != null && s.floor != null && s.furn != null;
    const W = s.wall != null ? walls[s.wall][1] : null, F = s.floor != null ? floors[s.floor][1] : null, U = s.furn != null ? furns[s.furn][1] : null;
    const wish = wishes[s.wish || 0];
    // 빈 조각보 (판 44): 고르기 전에도 칸 나눔이 보이게 칸마다 조금씩 다른 옅은 색
    const E = { wall: '#ECE8E1', sheer: '#F2EFEA', drape: '#E3DED6', furn: '#E8E4DD', floor: '#DFDAD2' };
    const dirSel = s.dir == null ? 1 : s.dir;
    const dirNames = ['한 톤 밝게', '가운데', '한 톤 짙게'];
    let drape = E.drape, sheer = E.sheer, dirs = [];
    if (step >= 4 && ready) {
      const WL = this.hexLab(W), FL = this.hexLab(F), UL = this.hexLab(U);
      const d = this.drapeLab(wish.id, WL, FL, UL);
      const fin = this.labHex(d[0], d[1], d[2]);
      const seekCols = ['#D8CFC2', '#B8AFA4', '#9A8F84', '#C9BBA8', '#A79E92'];
      const k = s.seek == null ? 5 : s.seek;
      // 방향 세 칸 (판 44): 누른 칸의 색이 창가 칸에 들어감
      const dh = [[6, 0.9], [0, 1], [-7, 1.1]].map(([dl, c]) => this.labHex(d[0] + dl, d[1] * c, d[2] * c));
      drape = k >= 5 ? dh[dirSel] : (k < 0 ? E.drape : seekCols[k]);
      sheer = k >= 5 ? this.labHex(94, WL[1] * 0.3, Math.max(2, WL[2] * 0.4)) : E.sheer;
      dirs = dh.map((hx, i) => ({ hex: k >= 5 ? hx : PAPER, dot: k >= 5 && i === dirSel ? '#8A4A22' : 'transparent', on: i === dirSel ? 'true' : 'false', name: dirNames[i], pick: () => set({ dir: i }) }));
    }
    const t = { wall: W || E.wall, floor: F || E.floor, furn: U || E.furn, drape, sheer };
    // 원단 결 (판 63): 창가 칸이 자리를 잡으면 옅은 기본 결(천이라는 표시) — 포근만 보송한 결
    //  바람이 결을 정하는 규칙은 리담 기준에 없으므로 만들지 않음(겉지 결은 상담에서 손님이 따로 고름). 속지 결은 넣지 않음
    //  결 사진: 기본 = 데미안 샤인, 보송 = 데미안 부클 (흑백 결만 뽑음)
    const landed = step >= 4 && ready && (s.seek == null || s.seek >= 5);
    const fluffy = wish.id === 'soft';
    const tex = {
      drape: [['images/e0f06c5fa1ee1083c4fad69a385c5b36.jpg', landed && !fluffy ? 0.55 : 0], ['images/1151f80ec70004b9b8a3da4c16533801.jpg', landed && fluffy ? 0.8 : 0]].map(([src, op]) => ({ src, op }))
    };
    const bars = [0, 1, 2, 3].map((i) => ({ c: step >= i ? '#2A2723' : '#E2DED7' }));
    const care = cares[s.care || 0];
    const summary = '[리담 · 내 공간으로 해 보기]\n공간: ' + spaces[s.space || 0] + '\n마음 쓰이는 것: ' + care.label + '\n벽: ' + (W ? walls[s.wall][0] : '') + ' · 바닥: ' + (F ? floors[s.floor][0] : '') + ' · 가구: ' + (U ? furns[s.furn][0] : '') + '\n바라는 느낌: ' + wish.label + '\n방향: ' + dirNames[dirSel];
    return {
      hf, bars, asking, q, rows, t, dirs, tex,
      colors: step === 2,
      done: step >= 4,
      notReady: !ready,
      nextBg: ready ? '#2A2723' : '#CFCAC1',
      next: () => { if (ready) set({ step: 3 }); },
      // 바람별 첫 문장 (판 63): 손님이 고른 색 이름을 넣어, 계산과 맞는 말만
      line: ready ? ({
        wide: walls[s.wall][0] + ' 벽의 밝기에 맞춰, 창가가 벽처럼 이어지게 합니다.',
        soft: walls[s.wall][0] + ' 벽보다 조금 짙고 따뜻한 색을 고르고, 결은 보송한 쪽으로 봅니다.',
        point: walls[s.wall][0] + ' 벽, ' + floors[s.floor][0] + ' 바닥, ' + furns[s.furn][0] + ' 가구 어디와도 겹치지 않는 색을 고릅니다.',
        calm: walls[s.wall][0] + ' 벽보다 한 톤 낮춰, 창가를 가라앉힙니다.'
      })[wish.id] : wish.line,
      line2: care.line,
      sendLabel: s.sent ? '복사했습니다 · 카톡에 붙여 넣어 주세요' : '고른 내용 보내고 상담 신청',
      send: () => {
        try { navigator.clipboard.writeText(summary); } catch (e) {}
        const KAKAO = '';   // 카톡 채널 대화창 주소 (판 44) — [채널 주소] 정해지면 넣기
        if (KAKAO) { try { window.open(KAKAO, '_blank', 'noopener'); } catch (e) {} }
        set({ sent: true });
      },
      restart: () => { (this.timers || []).forEach(clearTimeout); this.setState({ step: 0, sent: false, seek: null, dir: null }); },
      atStart: step === 0,
      notStart: step > 0,
      back: () => { (this.timers || []).forEach(clearTimeout); set({ step: Math.max(0, step - 1), sent: false, seek: null, dir: null }); }
    };
  }
}
DCMount(Component, {"hf": "고딕"});
</script>
