<style>
*{box-sizing:border-box}
body{margin:0;background:var(--rd-site-color-bg);color:var(--rd-site-color-text);font-family:'Noto Sans KR',sans-serif;font-size:var(--rd-site-type-body);line-height:1.6;letter-spacing:-.01em;word-break:keep-all}
a{color:var(--rd-site-color-text)}a:hover{color:#000}
button{-webkit-tap-highlight-color:transparent}
.wrap{max-width:1296px;margin:0 auto;padding:0 48px}
header .wrap{height:72px;display:flex;align-items:center;justify-content:space-between}
.logo{display:block;padding:10px 0}.logo svg{display:block;width:96px;height:auto}
nav{display:flex;align-items:center;gap:28px}
nav a{font-size:var(--rd-site-type-small);text-decoration:none;padding:14px 0;color:var(--rd-site-color-text-muted)}
nav a.cta{font-weight:500;color:var(--rd-site-color-text);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.42em}
.midq{display:flex;align-items:center;gap:8px}
.iconbtn{width:44px;height:44px;margin-left:-12px;display:flex;align-items:center;justify-content:center;padding:0;border:none;background:none;color:inherit;cursor:pointer}
main.wrap{padding-top:24px;padding-bottom:56px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;align-items:start}
.stagecol{grid-column:1 / span 7;display:flex;flex-direction:column;gap:12px}
.stage{position:relative;width:100%;aspect-ratio:16/11;overflow:hidden;background:#EAE8E1}
.panel{grid-column:9 / span 4;display:flex;flex-direction:column;min-height:560px}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.bars i{display:block;height:2px;background:var(--rd-site-color-line-soft);transition:background-color .3s}
.bars i.on{background:var(--rd-site-color-text)}
.q{padding-top:56px;display:flex;flex-direction:column;gap:36px;animation:rq .3s ease both;flex:1}
@keyframes rq{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1,h2{margin:0;font-family:'Noto Serif KR',serif;font-weight:400;letter-spacing:-.02em;white-space:pre-line}
h1{font-size:var(--rd-site-type-h2-m);line-height:1.45}
h2{font-size:var(--rd-site-type-h3);line-height:1.45}
.list{display:flex;flex-direction:column;border-top:1px solid var(--rd-site-color-line-soft)}
.opt{display:flex;align-items:center;justify-content:space-between;height:64px;padding:0;border:none;border-bottom:1px solid var(--rd-site-color-line-soft);background:none;font:inherit;color:var(--rd-site-color-text);text-align:left;cursor:pointer}
.opt svg{opacity:0;transform:translateX(-6px);transition:opacity .2s,transform .2s}
@media(hover:hover){.opt:hover svg{opacity:1;transform:none}}
.opt:focus-visible svg{opacity:1;transform:none}
.rows{display:flex;flex-direction:column;gap:22px}
.row p{margin:0 0 10px;line-height:1.5}
.row p b{font-weight:500}
.row p span{color:var(--rd-site-color-text-muted)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{width:52px;height:62px;padding:0;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;transition:transform .2s}
.chip.big{width:72px}
@media(hover:hover){.chip:hover{transform:translateY(-2px)}}
.chip .sw{display:block;width:100%;height:46px;border-radius:2px;box-shadow:inset 0 0 0 .5px rgba(42,39,35,.18)}
.chip .dt{display:block;width:6px;height:6px;border-radius:50%}

.btn{height:48px;border:none;border-radius:4px;background:var(--rd-site-color-button);color:var(--rd-site-color-button-text);font:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none}
.btn.line{border:1px solid var(--rd-site-color-line-strong);background:none;color:var(--rd-site-color-text)}
.next{align-self:flex-start;width:280px;max-width:100%}
.next[disabled]{background:var(--rd-site-color-button-off);cursor:default}
.res p{margin:0;max-width:400px;line-height:1.7}
.small{font-size:var(--rd-site-type-small);color:var(--rd-site-color-text-muted);line-height:1.6}
.textlink{align-self:flex-start;display:inline-flex;align-items:center;min-height:44px;font-size:var(--rd-site-type-lead);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.42em}
.actions{margin-top:auto;display:flex;align-items:center;gap:8px}
.actions .btn{flex:1}
.tel{width:48px;height:48px;border:1px solid var(--rd-site-color-line-strong);border-radius:4px;display:flex;align-items:center;justify-content:center;flex:none}
.quiet{align-self:center;height:44px;padding:0;border:none;background:none;font:inherit;font-size:var(--rd-site-type-tiny);color:var(--rd-site-color-text-muted);cursor:pointer}
dl{margin:36px 0 0;border-top:1px solid var(--rd-site-color-line-soft)}
dl div{display:flex;align-items:center;justify-content:space-between;height:60px;border-bottom:1px solid var(--rd-site-color-line-soft)}
dt{font-size:var(--rd-site-type-small);color:var(--rd-site-color-text-muted)}dd{margin:0}
.code{align-self:flex-end;margin-top:12px;font-size:var(--rd-site-type-small);color:var(--rd-site-color-text-muted);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.toggles{display:flex;flex-wrap:wrap;gap:0 24px;min-height:44px}
.toggles button{height:44px;padding:0;border:none;background:none;font:inherit;font-size:var(--rd-site-type-small);color:var(--rd-site-color-text);cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.42em}
.guide{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
.guide .dim{position:absolute;inset:0;background:rgba(42,39,35,.42)}
.guide .box{position:relative;width:100%;max-width:440px;max-height:100%;overflow:auto;background:var(--rd-site-color-bg);border-radius:8px;padding:32px 32px 20px;display:flex;flex-direction:column;gap:18px;animation:rq .3s ease both}
.guide pre{margin:0;padding:14px 16px;background:#fff;border:1px solid var(--rd-site-color-line-soft);border-radius:4px;font:inherit;font-size:var(--rd-site-type-tiny);line-height:1.6;white-space:pre-wrap;user-select:all;-webkit-user-select:all}
/* 그림 */
.svg-transition{transition:fill .65s cubic-bezier(.22,1,.36,1),stroke .65s cubic-bezier(.22,1,.36,1),opacity .6s cubic-bezier(.22,1,.36,1),transform .75s cubic-bezier(.22,1,.36,1),filter .7s ease}
.curtain-panel-left,.curtain-panel-right,.sheer-panel{transition:transform .85s cubic-bezier(.22,1,.36,1),opacity .5s ease}
#layer4-furniture>g,#layer5-lighting>g[id^="lamp-"]{transition:opacity .6s ease}
.pointer-events-none{pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* 폰 · 좁은 화면: 그림 위, 질문 아래 */
@media (max-width:900px){
  .wrap{padding:0 20px}
  header .wrap{height:56px}
  nav{gap:18px}
  main.wrap{display:flex;flex-direction:column;gap:20px;padding-top:4px;padding-bottom:40px}
  .stagecol{width:100%}
  .panel{width:100%;min-height:0}
  .q{padding-top:28px;gap:28px}
  .next{width:100%}
  .chip{width:calc((100% - 50px)/6)}
  .chip.big{width:calc((100% - 30px)/4)}
}
</style>

<body>
<header><div class="wrap" id="head"></div></header>
<main class="wrap">
  <div class="stagecol">
    <div class="stage" aria-hidden="true">
<svg id="roomSvg" viewBox="0 0 800 550" style="display:block;width:100%;height:100%" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <!-- Dynamic Clip Path for Space-Specific Window Glass Opening (Updated by JS per Space so curtains NEVER overlap furniture!) -->
                <clipPath id="windowClip">
                  <rect id="windowClipRect" x="410" y="68" width="270" height="310" />
                </clipPath>

                <!-- Clip path for the interior room wall & floor -->
                <clipPath id="roomInteriorClip">
                  <rect x="0" y="0" width="800" height="550" />
                </clipPath>

                <!-- Clip path for Studio Ultrawide Monitor Screen -->
                <clipPath id="monitorScreenClip">
                  <rect x="524" y="268" width="132" height="72" rx="3" />
                </clipPath>

                <!-- Subtle Pleat Pattern for Full Curtain -->
                <pattern id="curtainPleatPattern" x="0" y="0" width="24" height="360" patternUnits="userSpaceOnUse">
                  <rect x="0" y="0" width="9" height="360" fill="#000000" fill-opacity="0.075" />
                  <rect x="9" y="0" width="5" height="360" fill="#000000" fill-opacity="0.025" />
                  <rect x="14" y="0" width="10" height="360" fill="#FFFFFF" fill-opacity="0.06" />
                </pattern>

                <!-- Subtle Sheer Pleat Pattern -->
                <pattern id="sheerPleatPattern" x="0" y="0" width="16" height="360" patternUnits="userSpaceOnUse">
                  <rect x="0" y="0" width="8" height="360" fill="#FFFFFF" fill-opacity="0.25" />
                  <rect x="8" y="0" width="8" height="360" fill="#000000" fill-opacity="0.035" />
                </pattern>
              </defs>

              <!-- =======================================================
                   LAYER 1: ROOM ARCHITECTURE (WALL, MOLDING, FLOOR)
                   ======================================================= -->
              <g id="layer1-architecture">
                <!-- Back Wall -->
                <rect id="roomWall" x="0" y="0" width="800" height="404" fill="#E3E1DC" class="svg-transition" />
                <!-- Architectural Ceiling Cornice Shadow -->
                <rect x="0" y="0" width="800" height="6" fill="#000000" fill-opacity="0.035" />
                <!-- Architectural Baseboard Molding (걸레받이) -->
                <rect id="roomBaseboardTop" x="0" y="394" width="800" height="2" fill="#FFFFFF" fill-opacity="0.4" />
                <rect id="roomBaseboard" x="0" y="396" width="800" height="8" fill="#D2CFC7" class="svg-transition" />
                <!-- Floor Plane -->
                <rect id="roomFloor" x="0" y="404" width="800" height="146" fill="#C4C1B8" class="svg-transition" />
                <!-- Subtle Architectural Herringbone / Wide Plank Lines -->
                <g stroke="#000000" stroke-opacity="0.045" stroke-width="1">
                  <line x1="0" y1="436" x2="800" y2="436" />
                  <line x1="0" y1="472" x2="800" y2="472" />
                  <line x1="0" y1="512" x2="800" y2="512" />
                  <line x1="130" y1="404" x2="80" y2="550" />
                  <line x1="295" y1="404" x2="260" y2="550" />
                  <line x1="475" y1="404" x2="505" y2="550" />
                  <line x1="650" y1="404" x2="695" y2="550" />
                </g>
              </g>

              <!-- =======================================================
                   LAYER 2: SPACE-SPECIFIC RECESSED WINDOW & EXTERIOR WORLD
                   (Window position dynamically shifts per space so curtains never collide with furniture!)
                   ======================================================= -->
              <g id="layer2-window-exterior">
                <!-- Outer Window Casing & 3D Recessed Reveal -->
                <rect id="windowOuterFrame" x="398" y="56" width="294" height="332" rx="2" fill="#CFCBC2" class="svg-transition" />
                <rect id="windowInnerReveal" x="406" y="64" width="278" height="318" rx="1" fill="#B5B1A7" class="svg-transition" />

                <!-- Clipped Exterior World inside Window -->
                <g clip-path="url(#windowClip)">
                  <g id="exteriorWorldGroup" class="svg-transition">
                    <!-- Base Sky (Covers full 800x450 so it works at any window X position) -->
                    <rect id="extSky" x="0" y="0" width="800" height="450" fill="#FFFFFF" class="svg-transition" />

                    <!-- Sub-group A: Morning / Afternoon Warm Horizon Sky -->
                    <g id="extHorizonBand" opacity="0" class="svg-transition">
                      <rect id="extHorizonTop" x="0" y="50" width="800" height="165" fill="#DCE4EC" class="svg-transition" />
                      <rect id="extHorizonMid" x="0" y="210" width="800" height="80" fill="#F2DEC0" class="svg-transition" />
                      <rect id="extHorizonLow" x="0" y="280" width="800" height="120" fill="#F7E8CC" class="svg-transition" />
                      <circle id="extSunDisc" cx="560" cy="195" r="34" fill="#FFFDF7" fill-opacity="0.92" />
                    </g>

                    <!-- Sub-group B: Soft Greenery Hills ('채광은 살리고 싶어요' / '낮엔 환하게' / '밝고 환했으면') -->
                    <g id="extNatureHills" opacity="0" class="svg-transition">
                      <circle id="extNatureSun" cx="560" cy="130" r="24" fill="#FFFFFF" fill-opacity="0.75" />
                      <path d="M0 400 L0 265 Q180 230 360 265 T720 250 L800 260 L800 400 Z" fill="#C7D1C5" id="hillBack" class="svg-transition" />
                      <path d="M0 400 L0 300 Q220 270 430 302 T800 285 L800 400 Z" fill="#B2C0B0" id="hillFront" class="svg-transition" />
                    </g>

                    <!-- Sub-group C: Opposite Apartment Building ('바깥 시선이 신경 쓰여요') -->
                    <g id="extOppositeBuilding" opacity="0" class="svg-transition">
                      <rect id="oppBldgLeft" x="420" y="135" width="60" height="255" fill="#D5D3CD" />
                      <rect id="oppBldgMain" x="462" y="102" width="185" height="288" fill="#C4C1BA" />
                      <rect id="oppBldgRoof" x="458" y="96" width="193" height="7" fill="#ABA8A0" />
                      <g id="oppBldgWindows" fill="#8F8C85">
                        <rect x="480" y="122" width="28" height="32" rx="1" /><rect x="520" y="122" width="28" height="32" rx="1" />
                        <rect x="564" y="122" width="28" height="32" rx="1" /><rect x="604" y="122" width="28" height="32" rx="1" />
                        <rect x="480" y="174" width="28" height="32" rx="1" /><rect x="520" y="174" width="28" height="32" rx="1" fill="#75726B" />
                        <rect x="564" y="174" width="28" height="32" rx="1" /><rect x="604" y="174" width="28" height="32" rx="1" />
                        <rect x="480" y="226" width="28" height="32" rx="1" /><rect x="520" y="226" width="28" height="32" rx="1" />
                        <rect x="564" y="226" width="28" height="32" rx="1" fill="#75726B" /><rect x="604" y="226" width="28" height="32" rx="1" />
                        <rect x="480" y="278" width="28" height="32" rx="1" /><rect x="520" y="278" width="28" height="32" rx="1" />
                        <rect x="564" y="278" width="28" height="32" rx="1" /><rect x="604" y="278" width="28" height="32" rx="1" />
                      </g>
                      <!-- Neighbor Silhouette in opposite window -->
                      <circle id="oppNeighborHead" cx="534" cy="188" r="5.5" fill="#4A4843" />
                      <path id="oppNeighborBody" d="M524 206 C524 196 544 196 544 206 Z" fill="#4A4843" />
                    </g>

                    <!-- Sub-group D: Night Sky, Crescent Moon & Lit Apartment Windows ('밤 모드' & '밤에 불 켜면 안이 다 보여요') -->
                    <g id="extNightExposed" opacity="0" class="svg-transition">
                      <rect x="0" y="0" width="800" height="450" fill="#141923" />
                      <!-- Crescent Moon & Subtle Stars -->
                      <circle id="nightMoon" cx="620" cy="112" r="14" fill="#F7E8BA" />
                      <circle id="nightMoonCut" cx="626" cy="108" r="12" fill="#141923" />
                      <circle cx="465" cy="98" r="1.5" fill="#FFF8DE" opacity="0.7" />
                      <circle cx="535" cy="126" r="1.2" fill="#FFF8DE" opacity="0.5" />
                      <circle cx="345" cy="105" r="1.5" fill="#FFF8DE" opacity="0.6" />
                      <circle cx="155" cy="112" r="1.5" fill="#FFF8DE" opacity="0.6" />
                      <!-- Distant Night Skyline across all X coordinates -->
                      <rect x="90" y="145" width="95" height="260" fill="#1F2633" />
                      <rect x="200" y="165" width="110" height="240" fill="#1B212D" />
                      <rect x="325" y="135" width="100" height="270" fill="#212836" />
                      <rect x="440" y="128" width="105" height="275" fill="#222938" />
                      <rect x="560" y="152" width="115" height="250" fill="#1C222E" />
                      <!-- Warm Lit Distant Windows -->
                      <g fill="#E8C974" opacity="0.9">
                        <rect x="112" y="175" width="16" height="18" rx="1" />
                        <rect x="148" y="220" width="16" height="18" rx="1" />
                        <rect x="225" y="195" width="16" height="18" rx="1" />
                        <rect x="268" y="245" width="16" height="18" rx="1" />
                        <rect x="348" y="168" width="16" height="18" rx="1" />
                        <rect x="386" y="212" width="16" height="18" rx="1" />
                        <rect x="462" y="156" width="18" height="20" rx="1" />
                        <rect x="502" y="198" width="18" height="20" rx="1" />
                        <rect x="462" y="262" width="18" height="20" rx="1" />
                        <rect x="584" y="182" width="18" height="20" rx="1" />
                        <rect x="626" y="226" width="18" height="20" rx="1" />
                      </g>
                    </g>

                    <!-- Sub-group E: Night Streetlight Glare ('밤에 바깥 불빛이 들어와요') -->
                    <g id="extNightStreetlight" opacity="0" class="svg-transition">
                      <rect x="0" y="0" width="800" height="450" fill="#141822" />
                      <rect x="475" y="175" width="135" height="215" fill="#1E2430" />
                      <!-- Architectural Streetlamp Outside Bedroom Window -->
                      <rect x="688" y="118" width="6" height="265" fill="#464B57" />
                      <path d="M691 122 L624 122 L614 132" stroke="#5E6472" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
                      <polygon points="598,132 632,132 638,141 592,141" fill="#3A3F4B" />
                      <rect x="598" y="140" width="34" height="5" rx="2" fill="#FFF5CC" />
                      <polygon points="598,144 632,144 730,365 460,365" fill="#DCE6F7" fill-opacity="0.25" />
                    </g>

                    <!-- Sub-group F: Street Passerby Silhouette ('지나가는 시선이 신경 쓰여요' - Studio Window Left) -->
                    <g id="extStreetPasserby" opacity="0" class="svg-transition">
                      <rect x="0" y="0" width="800" height="450" fill="#E3E1DA" />
                      <rect x="50" y="95" width="340" height="175" fill="#D2CFC7" />
                      <rect x="95" y="125" width="95" height="95" fill="#BDB9B0" />
                      <rect x="225" y="125" width="95" height="95" fill="#BDB9B0" />
                      <rect x="50" y="270" width="340" height="120" fill="#C4C0B7" />
                      <line x1="50" y1="270" x2="390" y2="270" stroke="#ABA79E" stroke-width="3" />
                      <!-- Minimalist Passerby Figures Looking In -->
                      <g fill="#57544F">
                        <circle cx="168" cy="276" r="11" />
                        <path d="M148 385 L152 306 C152 294 184 294 184 306 L188 385 Z" />
                      </g>
                      <g fill="#75726B">
                        <circle cx="264" cy="288" r="9.5" />
                        <path d="M247 385 L250 316 C250 305 278 305 278 316 L281 385 Z" />
                      </g>
                    </g>
                  </g>
                </g>

                <!-- Architectural Window Mullions & Sill (Dynamically positioned by JS to match each space's window!) -->
                <g id="windowMullions">
                  <rect id="winGlassBorder" x="410" y="68" width="270" height="310" fill="none" stroke="#B5B1A7" stroke-width="6" />
                  <rect id="winCenterMullion" x="541" y="68" width="8" height="310" fill="#B5B1A7" />
                  <line id="winCenterLine" x1="545" y1="68" x2="545" y2="378" stroke="#99958B" stroke-width="1.5" />
                  <line id="winTransomBar" x1="410" y1="142" x2="680" y2="142" stroke="#B5B1A7" stroke-width="3" stroke-opacity="0.65" />
                  <rect id="winSill" x="392" y="376" width="306" height="8" rx="1" fill="#C4C0B6" />
                  <rect id="winSillShadow" x="396" y="384" width="298" height="4" fill="#000000" fill-opacity="0.08" />
                </g>

function hexLab(h){const v=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(c=>c>0.04045?Math.pow((c+0.055)/1.055,2.4):c/12.92);const x=(v[0]*0.4124+v[1]*0.3576+v[2]*0.1805)/0.95047,y=v[0]*0.2126+v[1]*0.7152+v[2]*0.0722,z=(v[0]*0.0193+v[1]*0.1192+v[2]*0.9505)/1.08883;const f=t=>t>0.008856?Math.cbrt(t):7.787*t+16/116;return[116*f(y)-16,500*(f(x)-f(y)),200*(f(y)-f(z))];}
function labHex(L,a,b){const fy=(L+16)/116,fx=fy+a/500,fz=fy-b/200;const g=t=>t*t*t>0.008856?t*t*t:(t-16/116)/7.787;const X=0.95047*g(fx),Y=g(fy),Z=1.08883*g(fz);const r=[3.2406*X-1.5372*Y-0.4986*Z,-0.9689*X+1.8758*Y+0.0415*Z,0.0557*X-0.204*Y+1.057*Z];return'#'+r.map(c=>{c=Math.max(0,Math.min(1,c));c=c>0.0031308?1.055*Math.pow(c,1/2.4)-0.055:12.92*c;return('0'+Math.round(c*255).toString(16)).slice(-2);}).join('').toUpperCase();}
function dE(p,q){return Math.hypot(p[0]-q[0],p[1]-q[1],p[2]-q[2]);}
function shade(h,dl){const l=hexLab(h);return labHex(l[0]+dl,l[1],l[2]);}
function mix(a,b,t){const p=hexLab(a),q=hexLab(b);return labHex(p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t,p[2]+(q[2]-p[2])*t);}
function drapeLab(wish,W,F,U){
  if(wish==='wide')return[W[0]-4,W[1]*0.8,W[2]*0.8+1];
  if(wish==='soft')return[W[0]-10,(W[1]+F[1])*0.3+0.5,Math.max(W[2],5)+3];
  if(wish==='calm')return[W[0]-21,W[1]*0.3,W[2]*0.3-1];
  const c=[[30,26,9],[46,-4,-15],[47,-6,17],[36,1,-2]];let best=c[0],sc=-1;
  c.forEach(x=>{const s=Math.min(dE(x,W),dE(x,F),dE(x,U));if(s>sc){sc=s;best=x;}});return best;
}

const LOGO=document.getElementById('logoTpl').innerHTML;
function drawHead(){
  // 첫 질문 · 결과 · 링크로 연 신청서 = 다른 쪽과 같은 머리 / 질문 푸는 동안 = 이전 질문 + 로고
  const top=S.step===0||S.step===4||S.view;
  $('head').innerHTML=top
    ?`<a class="logo" href="${P}index.html" aria-label="리담 홈" data-home>${LOGO}</a><nav aria-label="쪽 이동"><a href="${P}index.html" data-home>홈</a><a href="${P}story.html">리담 이야기</a><a class="cta" href="https://pf.kakao.com/_xkxgxhNX/chat" target="_blank" rel="noopener">상담 신청</a></nav>`
    :`<div class="midq"><button type="button" class="iconbtn" aria-label="이전 질문" data-back>${BACK}</button><a class="logo" href="${P}index.html" aria-label="리담 홈" data-home>${LOGO}</a></div>`;
}
function chipRow(label,list,key,big){
  const picked=S[key]!=null?' · '+list[S[key]][0]:'';
  return `<div class="row" role="radiogroup" aria-label="${label}"><p><b>${label}</b><span>${picked}</span></p><div class="chips">${
    list.map(([n,h],i)=>`<button type="button" class="chip${big?' big':''}" role="radio" aria-checked="${S[key]===i}" aria-label="${n}" data-k="${key}" data-i="${i}"><span class="sw" style="background:${h}"></span><span class="dt"></span></button>`).join('')}</div></div>`;
}
function resultLine(){
  const w=WISHES[S.wish].id,wn=WALLS[S.wall][0];
  return({wide:wn+' 벽의 밝기에 맞춰, 창가가 벽처럼 이어지게 합니다.',soft:wn+' 벽보다 조금 짙고 따뜻한 색을 고르고, 결은 보송한 쪽으로 봅니다.',
    point:wn+' 벽, '+FLOORS[S.floor][0]+' 바닥, '+FURNS[S.furn][0]+' 가구 어디와도 겹치지 않는 색을 고릅니다.',calm:wn+' 벽보다 한 톤 낮춰, 창가를 가라앉힙니다.'})[w];
}
function msg(){return '안녕하세요. 리담 홈페이지에서 상담 신청해요.\nredam.kr/try?r='+code();}
function drawPanel(){
  const b=$('panelBody'),st=S.step;
  document.querySelectorAll('.bars i').forEach((e,i)=>e.classList.toggle('on',st>=i));
  document.querySelector('.bars').style.visibility=st>=5?'hidden':'visible';
  if(st===0||st===1){
    const title=st===0?'어느 공간의 창인가요?':'창가에서 가장\n마음 쓰이는 것은요?';
    const opts=st===0?SPACES.map(s=>s.name):sp().cares.map(c=>c.t);
    b.innerHTML=`<div class="q"><h1>${title}</h1><div class="list">${opts.map((t,i)=>`<button type="button" class="opt" data-pick="${i}"><span>${t}</span>${ARW}</button>`).join('')}</div></div>`;
  }else if(st===2){
    const ready=S.wall!=null&&S.floor!=null&&S.furn!=null;
    b.innerHTML=`<div class="q"><h1>벽·바닥·가구는\n어떤 색에 가까우세요?</h1><div class="rows">${chipRow('벽',WALLS,'wall')}${chipRow('바닥',FLOORS,'floor')}${chipRow('가구',FURNS,'furn')}</div><button type="button" class="btn next" data-next="3" ${ready?'':'disabled'}>다음</button></div>`;
  }else if(st===3){
    const cc=curtainColors();
    b.innerHTML=`<div class="q"><h1>커튼은 어떤 색이\n좋으세요?</h1><div class="rows">${chipRow('커튼',WISHES.map((w,i)=>[w.name,cc.drapes[i]]),'wish',true)}</div><button type="button" class="btn next" data-next="4" ${S.wish!=null?'':'disabled'}>다음</button></div>`;
  }else if(st===4){
    b.innerHTML=`<div class="q res" style="gap:0"><h1>이런 쪽으로 고릅니다</h1>
      <p style="margin-top:28px">${resultLine()}</p><p style="margin-top:8px">${care().line}</p>
      <p class="small" style="margin-top:16px;max-width:400px">화면의 색은 실제와 다릅니다. 방문하면 공간의 색과 창으로 드는 빛을 재고, 그에 맞는 원단 서너 가지를 추려 권합니다.</p>
      <a class="textlink" href="${P}cases.html" style="margin-top:12px">시공 사례</a>
      <div class="actions" style="margin-top:auto;padding-top:28px"><a class="tel" href="tel:010-7523-1952" aria-label="전화로 상담">${TEL}</a><button type="button" class="btn" data-form>상담 신청</button></div>
      <button type="button" class="quiet" data-again style="margin-top:8px">다시 해 보기</button></div>`;
  }else{
    const c=care(),rows=[['공간',sp().name],['마음 쓰이는 것',c.s],['바라는 느낌',WISHES[S.wish].name]];
    const send=S.view?`<button type="button" class="btn line" data-again>직접 해 보기</button>`
      :`<a class="tel" href="tel:010-7523-1952" aria-label="전화로 상담">${TEL}</a>${PHONE?`<a class="btn" href="sms:01075231952${IOS?'&':'?'}body=${encodeURIComponent(msg())}">문자로 보내기</a>`:''}<button type="button" class="btn${PHONE?' line':''}" data-kakao>카톡으로 보내기</button>`;
    b.innerHTML=`<div class="q" style="gap:0"><h1>${S.view?'이렇게 고르셨습니다':'이 내용으로\n상담을 신청합니다'}</h1>
      <dl>${rows.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl><span class="code">${code()}</span>
      <div class="actions" style="padding-top:28px">${send}</div></div>`;
  }
}
function drawToggles(){
  const t=$('toggles');
  if(S.wish==null||S.step<3){t.innerHTML='';return;}
  const night=S.time==='night',btn=(k,label)=>`<button type="button" data-t="${k}">${label}</button>`;
  t.innerHTML=btn('curtain',S.closed?'커튼 열기':'커튼 닫기')+btn('time',night?'낮으로 보기':'밤으로 보기')+(night?btn('ceil',S.ceil?'방 등 끄기':'방 등 켜기')+btn('stand',S.stand?'스탠드 끄기':'스탠드 켜기'):'');
}
function drawGuide(){
  const g=$('guideRoot');
  if(!S.guide){g.innerHTML='';return;}
  g.innerHTML=`<div class="guide" role="dialog" aria-modal="true" aria-label="카톡으로 상담 신청"><div class="dim" data-close></div><div class="box">
    <h2>${S.copied?'신청 글을 복사해 두었습니다':'아래 글을 길게 눌러 복사해 주세요'}</h2><pre>${msg()}</pre>
    <p style="margin:0;line-height:1.6">${TOUCH?'카톡 창의 글 쓰는 칸을 꾹 눌러 붙여 넣어 주세요.':'카톡 창의 글 쓰는 칸에 Ctrl+V(맥은 ⌘+V)로 붙여 넣어 주세요.'}</p>
    <a class="btn" href="https://pf.kakao.com/_xkxgxhNX/chat" target="_blank" rel="noopener" data-openkakao>카톡 열기</a>
    <button type="button" class="quiet" data-close>닫기</button></div></div>`;
}
function render(){drawScene();drawHead();drawPanel();drawToggles();drawGuide();}

// ───── 누르기 ─────
function copyText(txt){
  let ok=false;
  try{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px;';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);ok=document.execCommand('copy');document.body.removeChild(ta);}catch(e){}
  try{if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(()=>{if(!ok){S.copied=true;drawGuide();}},()=>{});}catch(e){}
  return ok;
}
function closeCurtain(){
  stop();const c=care();
  // 침실 밤 바깥 불빛: 스탠드가 켜진 채 암막이 닫혀 색을 보여 주고 → 2.6초 뒤 스탠드가 꺼짐
  const longNight=c.id==='bed-2'&&S.time==='night';
  if(reduce){S.closed=true;if(longNight)S.stand=false;render();return;}
  timers.push(setTimeout(()=>{S.closed=true;render();},120));
  if(longNight){S.stand=true;S.ceil=false;timers.push(setTimeout(()=>{S.stand=false;render();},2600));}
}
function restart(){stop();try{if(location.search)history.replaceState(null,'',location.pathname);}catch(e){}
  Object.assign(S,{step:0,space:null,care:null,wall:null,floor:null,furn:null,wish:null,closed:false,time:'day',ceil:false,stand:false,view:false,guide:false});render();}
function goBack(){
  stop();const st=S.step;S.guide=false;
  if(st===5)S.step=4;
  else if(st===4)S.step=3;
  else if(st===3){S.step=2;S.wish=null;S.closed=false;lightsFor(care());}
  else if(st===2){S.step=1;S.care=null;S.wall=S.floor=S.furn=null;S.time='day';S.ceil=S.stand=false;}
  else if(st===1){S.step=0;S.space=null;}
  render();
}
document.addEventListener('click',e=>{
  const t=e.target,q=s=>t.closest(s);
  if(q('[data-home]')){try{const r=document.referrer?new URL(document.referrer):null;if(r&&r.origin===location.origin&&/\/(index\.html)?$/.test(r.pathname)&&history.length>1){e.preventDefault();history.back();}}catch(err){}return;}
  if(q('[data-back]')){goBack();return;}
  const o=q('[data-pick]');
  if(o){const i=+o.dataset.pick;if(S.step===0){S.space=i;S.step=1;}else{S.care=i;S.step=2;lightsFor(care());}render();return;}
  const ch=q('.chip');
  if(ch){const k=ch.dataset.k,i=+ch.dataset.i,first=k==='wish'&&S.wish==null;S[k]=i;if(first){S.closed=false;render();closeCurtain();}else render();return;}
  const nx=q('[data-next]');if(nx&&!nx.disabled){S.step=+nx.dataset.next;render();return;}
  if(q('[data-form]')){S.step=5;render();return;}
  if(q('[data-again]')){restart();return;}
  if(q('[data-kakao]')){S.copied=copyText(msg());S.guide=true;drawGuide();return;}
  if(q('[data-openkakao]')){if(copyText(msg()))S.copied=true;return;}
  if(q('[data-close]')){S.guide=false;drawGuide();return;}
  const tg=q('[data-t]');
  if(tg){stop();const k=tg.dataset.t;
    if(k==='curtain')S.closed=!S.closed;
    else if(k==='time'){S.time=S.time==='night'?'day':'night';S.ceil=S.time==='night';S.stand=false;}
    else if(k==='ceil')S.ceil=!S.ceil;
    else if(k==='stand')S.stand=!S.stand;
    render();}
});
// 신청 번호 링크(?r=10000~44559): 고른 것을 되살려 신청서로 — 커튼은 닫힌 모습
(function(){try{
  const m=/[?&]r=(\d{5})(?:&|$)/.exec(location.search);if(!m)return;
  let n=parseInt(m[1],10)-10000;if(!(n>=0&&n<34560))return;
  const take=k=>{const v=n%k;n=(n-v)/k;return v;};
  take(3);const wish=take(4),furn=take(5),floor=take(6),wall=take(6),c=take(4),space=n;
  Object.assign(S,{step:5,view:true,space,care:c,wall,floor,furn,wish,closed:true});lightsFor(care());S.stand=false;
}catch(e){}})();
render();
</script>
