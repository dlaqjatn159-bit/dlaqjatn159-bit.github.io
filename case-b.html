class Component extends DCLogic {
  // 움직임 (6단계): 글·사진은 처음 들어올 때 한 번만 옅게
  findRoot(sel) {
    const hit = document.querySelector(sel);
    if (hit) return hit;
    const walk = (node) => {
      const all = node.querySelectorAll('*');
      for (let i = 0; i < all.length; i++) {
        const sr = all[i].shadowRoot;
        if (sr) { const f = sr.querySelector(sel) || walk(sr); if (f) return f; }
      }
      return null;
    };
    return walk(document);
  }
  componentDidMount() {
    if (!window.IntersectionObserver) return;
    const root = this.rootEl || this.findRoot('[data-rm="case-b-pc"]');
    if (!root) {
      this.tries = (this.tries || 0) + 1;
      if (this.tries < 20) this.retry = setTimeout(() => this.componentDidMount(), 150);
      return;
    }
    this.setupImp(root);
    let reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

    root.setAttribute('data-on', '');
    this.io = new IntersectionObserver((list) => {
      list.forEach((e) => {
        if (e.isIntersecting) { e.target.setAttribute('data-in', ''); this.io.unobserve(e.target); }
      });
    }, { rootMargin: '0px 0px -10% 0px' });

    root.querySelectorAll('.rm').forEach((el) => { const r = el.getBoundingClientRect(); if (r.top < window.innerHeight && r.bottom > 0) { el.setAttribute('data-in', ''); this.io.unobserve(el); } });
  }

  setupImp(root) {
    const wrap = root.querySelector('[data-imp]');
    if (!wrap) return;
    const stage = wrap.querySelector('.imp-stage');
    if (!stage) return;
    const n = wrap.querySelectorAll('.imp-c').length || 6;
    // 판 52: 캔버스처럼 화면이 아주 길면(스크롤 없음) 여섯 인상을 펼쳐 보이고 끝
    if (window.innerHeight >= 1500) { wrap.setAttribute('data-flat', ''); return; }

    this.impCur = 0; this.impGo = 0;

    return { hf, setRoot: this.setRoot };
  }
